# Shared by both halves.

# There is no power switch, so idle halves go to deep sleep (any key wakes)
# and Fn + B held for 1 s turns both off (inner thumb key wakes each half).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_PM_SOFT_OFF=y

# Scroll wheel and click keys on the Nav layer
CONFIG_ZMK_POINTING=y

# src/fatal_reboot.c restarts a half after a firmware crash
CONFIG_REBOOT=y
